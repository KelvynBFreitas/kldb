[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kldb"
version = "0.1.0"
description = "Conector simplificado para Oracle e Postgres usando SQLAlchemy + Pandas"
authors = [
    { name = "Kelvyn Freitas", email = "Kelvyn_fr21@hotmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "pandas>=2.0.3,<3.0",
    "sqlalchemy>=1.4",
    "python-dotenv>=1.0.0",
    "numpy>=1.21,<3.0",
    "psycopg2-binary>=2.9",
    "oracledb>=1.0.0"
]

[project.optional-dependencies]
oracle = ["oracledb>=1.0.0"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["black", "ruff", "pytest"]

[project.urls]
Homepage = "https://github.com/KelvynBFreitas/kldb"
Bug_Tracker = "https://github.com/KelvynBFreitas/kldb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kldb*"]
