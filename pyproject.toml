[build-system]
requires = ["setuptools>=61.0", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "kldb"
version = "0.2.0"
description = "Conector simplificado para Oracle e Postgres usando SQLAlchemy + Pandas"
authors = [
    { name = "Kelvyn Freitas", email = "Kelvyn_fr21@hotmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "pandas>=2.0.3",
    "sqlalchemy>=1.4",
    "python-dotenv>=1.0.0",
    "numpy>=1.21,<3.0",
]

[project.optional-dependencies]
oracle = ["oracledb>=1.0.0"]
postgres = ["psycopg2-binary>=2.9", "psycopg>=3.3.3", "psycopg-binary>=3.3.3"]
all = [
    "oracledb>=1.0.0",
    "psycopg2-binary>=2.9",
    "psycopg>=3.3.3",
    "psycopg2>=2.9.12",
    "psycopg-binary>=3.3.3",
]
dev = ["black", "ruff", "pytest"]

[project.urls]
"Homepage" = "https://github.com/KelvynBFreitas/kldb"
"Bug Tracker" = "https://github.com/KelvynBFreitas/kldb/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kldb*"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
target-version = ["py38"]
line-length = 120
