[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kloracle"
version = "0.1.0"
description = "Conector simplificado para Oracle usando SQLAlchemy + Pandas"
authors = [
    { name="Kelvyn Freitas", email="Kelvyn_fr21@hotmail.com" }
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "pandas",
    "sqlalchemy",
    "python-dotenv",
    "oracledb"
]

[project.urls]
"Homepage" = "https://github.com/KelvynBFreitas/KLoracle"
"Bug Tracker" = "https://github.com/KelvynBFreitas/KLoracle/issues"
